name: Build and inject Comment Privacy

on:
  workflow_dispatch:
    inputs:
      ryukgram_ipa_url:
        description: 'Direct HTTPS URL to RyukGram IPA, even if CommentPrivacy is already injected'
        required: false
        default: ''
        type: string
  push:
    paths:
      - 'CommentPrivacy/**'
      - '.github/workflows/comment-privacy.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compile iOS arm64 dylib
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p dist
          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK" \
            -fobjc-arc -fmodules -Os -Wall -Wextra \
            -dynamiclib -Wl,-install_name,@rpath/CommentPrivacy.dylib \
            -framework UIKit -framework Foundation \
            CommentPrivacy/CommentPrivacy.m -o dist/CommentPrivacy.dylib
          codesign --force --sign - dist/CommentPrivacy.dylib
          file dist/CommentPrivacy.dylib
          xcrun otool -L dist/CommentPrivacy.dylib

      - name: Upload CommentPrivacy.dylib
        uses: actions/upload-artifact@v4
        with:
          name: CommentPrivacy-dylib
          path: dist/CommentPrivacy.dylib
          if-no-files-found: error

      - name: Download existing RyukGram IPA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ryukgram_ipa_url != '' }}
        env:
          SOURCE_URL: ${{ inputs.ryukgram_ipa_url }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE_URL" in
            https://*) ;;
            *) echo '::error::A direct HTTPS download URL is required'; exit 1 ;;
          esac
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            --output dist/RyukGram-original.ipa "$SOURCE_URL"
          unzip -tq dist/RyukGram-original.ipa
          unzip -Z1 dist/RyukGram-original.ipa | grep -Eq '^Payload/[^/]+\.app/Info\.plist$' || {
            echo '::error::Downloaded file is not an IPA'; exit 1;
          }

      - name: Install injection utility
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ryukgram_ipa_url != '' }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/asdfzxcvbn/ipapatch/releases/download/v2.1.3/ipapatch.macos-arm64' \
            -o dist/ipapatch
          chmod +x dist/ipapatch

      - name: Inject or update Comment Privacy in RyukGram IPA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ryukgram_ipa_url != '' }}
        run: |
          set -euo pipefail
          OUTPUT="$GITHUB_WORKSPACE/dist/RyukGram-CommentPrivacy.ipa"
          INPUT="$GITHUB_WORKSPACE/dist/RyukGram-original.ipa"
          if unzip -Z1 "$INPUT" | grep -Eq '^Payload/[^/]+\.app/Frameworks/CommentPrivacy\.dylib

      - name: Upload patched IPA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ryukgram_ipa_url != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: RyukGram-CommentPrivacy-unsigned-IPA
          path: dist/RyukGram-CommentPrivacy.ipa
          if-no-files-found: error
; then
            echo "Existing CommentPrivacy.dylib found — replacing binary without adding another load command"
            STAGE="$(mktemp -d)"
            unzip -q "$INPUT" -d "$STAGE"
            APP="$(find "$STAGE/Payload" -mindepth 1 -maxdepth 1 -type d -name '*.app' | head -n1)"
            test -n "$APP"
            test -f "$APP/Frameworks/CommentPrivacy.dylib"
            cp dist/CommentPrivacy.dylib "$APP/Frameworks/CommentPrivacy.dylib"
            (cd "$STAGE" && zip -qry "$OUTPUT" .)
            rm -rf "$STAGE"
          else
            echo "No previous Comment Privacy binary — injecting into the existing RyukGram IPA"
            dist/ipapatch \
              --input "$INPUT" \
              --output "$OUTPUT" \
              --dylib dist/CommentPrivacy.dylib \
              --noconfirm
          fi
          unzip -tq "$OUTPUT"
          unzip -Z1 "$OUTPUT" | grep 'CommentPrivacy.dylib'
          echo 'IPA patched; re-sign in ESign/Feather before installation.'

      - name: Upload patched IPA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ryukgram_ipa_url != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: RyukGram-CommentPrivacy-unsigned-IPA
          path: dist/RyukGram-CommentPrivacy.ipa
          if-no-files-found: error
